<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Без этого Chrome открывает страницу настроек не отдельной вкладкой, а
         встроенным окном (~520px) поверх chrome://extensions — там наш широкий
         layout ломается. open_in_tab заставляет Chrome/Firefox открывать
         options.html полноценной вкладкой браузера. -->
    <meta name="manifest.open_in_tab" content="true" />
    <title>TF2 Trade Suite Tools — настройки</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
